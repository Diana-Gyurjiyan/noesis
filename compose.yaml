services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paper_radar
      POSTGRES_USER: paper_radar
      POSTGRES_PASSWORD: paper_radar
    ports:
      - "5432:5432"
    volumes:
      - paper_radar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_radar -d paper_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paper_radar_postgres:
