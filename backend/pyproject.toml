[project]
name = "paper-radar"
version = "0.2.0"
description = "An agent that periodically fetches, evaluates, and clusters research papers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic>=2.6",
    "pypdf>=6.20.0",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false   # Loose modules; no build step is required for `uv sync` or `uv run`.
